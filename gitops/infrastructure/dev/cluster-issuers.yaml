# gitops/infrastructure/dev/cluster-issuers.yaml
#
# Two ClusterIssuers: use letsencrypt-staging while testing (higher rate
# limits, but certs are untrusted by browsers) and switch a Certificate/
# Ingress to letsencrypt-prod once the staging path is proven working.
#
# No accessKeyID/secretAccessKeySecretRef is set for route53 — this
# relies on ambient credentials from EKS Pod Identity (the role
# associated in modules/eks-cluster/cert-manager-iam.tf), which is why
# --issuer-ambient-credentials=true had to be set on the cert-manager
# controller (see cert-manager.yaml).
#
# sync-wave "1" — must come after cert-manager.yaml's wave "0", since
# these objects require the ClusterIssuer CRD that cert-manager installs.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: matteceejay@gmail.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          route53:
            region: us-east-1
            hostedZoneID: Z06378293QWI1PIU1LSKR
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: matteceejay@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          route53:
            region: us-east-1
            hostedZoneID: Z06378293QWI1PIU1LSKR