# gitops/infrastructure/dev/cluster-issuers.yaml
#
# Delivers the raw ClusterIssuer CRs in ./cluster-issuers/ as their own
# ArgoCD Application. This has to be an Application (not raw CRs sitting
# in the app-of-apps root) because app-of-apps runs API discovery over
# every manifest in its directory before applying ANY sync-wave. Raw
# ClusterIssuer objects reference cert-manager.io/v1, which does not
# exist until the cert-manager chart installs its CRDs, so their
# presence in the root made the entire app-of-apps sync fail
# ("failed to discover server resources for group version
# cert-manager.io/v1") and wave "0" never ran.
#
# sync-wave "0" for cert-manager.yaml and "1" here makes app-of-apps
# create the cert-manager Application first. SkipDryRunOnMissingResource
# lets THIS Application's own sync succeed even while the ClusterIssuer
# CRD is still missing; automated + selfHeal + retry then reconciles the
# issuers as soon as cert-manager finishes installing.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-issuers
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/matteceejay/eks-platform.git
    targetRevision: main
    path: gitops/infrastructure/dev/cluster-issuers
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
