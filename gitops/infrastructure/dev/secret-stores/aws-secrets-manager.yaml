# gitops/infrastructure/dev/secret-stores/aws-secrets-manager.yaml
#
# Raw external-secrets CR, NOT an ArgoCD Application. Lives in this
# subdirectory (not the app-of-apps root) and is delivered by the
# `secret-stores` Application in ../secret-store.yaml, which carries
# SkipDryRunOnMissingResource=true so it tolerates the external-secrets.io
# CRDs not existing until the external-secrets Application (sync-wave "0")
# has installed them.
#
# No credentials block: the external-secrets controller authenticates to
# Secrets Manager via ambient IAM (EKS Pod Identity / IRSA on the
# external-secrets ServiceAccount) — same pattern as the ALB and
# cert-manager controllers.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
