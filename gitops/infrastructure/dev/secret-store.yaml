# gitops/infrastructure/dev/secret-store.yaml
#
# Delivers the raw external-secrets CRs in ./secret-stores/ as their own
# ArgoCD Application. This has to be an Application (not raw CRs in the
# app-of-apps root) because app-of-apps runs API discovery over every
# manifest in its directory before applying ANY sync-wave. A raw
# ClusterSecretStore references external-secrets.io/v1, which does not
# exist until the external-secrets chart installs its CRDs, so its
# presence in the root made the whole app-of-apps sync fail
# ("failed to discover server resources for group version
# external-secrets.io/v1") and wave "0" never ran.
#
# sync-wave "0" for external-secrets.yaml and "1" here makes app-of-apps
# create the external-secrets Application first. SkipDryRunOnMissingResource
# lets THIS Application's own sync succeed while the CRDs are still
# missing; automated + selfHeal + retry then reconciles the store as soon
# as external-secrets finishes installing.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secret-stores
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/matteceejay/eks-platform.git
    targetRevision: main
    path: gitops/infrastructure/dev/secret-stores
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 15s
        factor: 2
        maxDuration: 5m
