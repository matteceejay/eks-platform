apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.10.0
    helm:
      values: |
        installCRDs: true
        serviceAccount:
          name: external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The ClusterSecretStore / SecretStore CRDs are >256KB, which blows
      # the metadata.annotations limit under client-side apply (ArgoCD
      # writes the whole manifest into last-applied-configuration). Server
      # -side apply doesn't use that annotation, so the big CRDs install.
      - ServerSideApply=true