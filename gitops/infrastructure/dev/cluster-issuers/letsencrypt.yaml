# gitops/infrastructure/dev/cluster-issuers/letsencrypt.yaml
#
# Two ClusterIssuers: use letsencrypt-staging while testing (higher rate
# limits, but certs are untrusted by browsers) and switch a Certificate/
# Ingress to letsencrypt-prod once the staging path is proven working.
#
# No accessKeyID/secretAccessKeySecretRef is set for route53 — this
# relies on ambient credentials from EKS Pod Identity (the role
# associated in modules/eks-cluster/cert-manager-iam.tf), which is why
# --issuer-ambient-credentials=true had to be set on the cert-manager
# controller (see ../cert-manager.yaml).
#
# These are raw cert-manager CRs, NOT ArgoCD Applications — they live in
# this subdirectory (not the app-of-apps root) and are delivered by the
# `cluster-issuers` Application in ../cluster-issuers.yaml. That
# Application carries SkipDryRunOnMissingResource=true, so it tolerates
# the ClusterIssuer CRD not existing yet and reconciles cleanly once the
# cert-manager Application (sync-wave "0") has installed the CRDs.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: matteceejay@gmail.com
    privateKeySecretRef:
      name: letsencrypt-staging-account-key
    solvers:
      - dns01:
          route53:
            region: us-east-1
            hostedZoneID: Z06378293QWI1PIU1LSKR
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: matteceejay@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          route53:
            region: us-east-1
            hostedZoneID: Z06378293QWI1PIU1LSKR
